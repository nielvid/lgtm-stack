global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    cluster: lgtm-stack
    environment: production

# ---- Alertmanager ------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# ---- Alert Rules -------------------------------------------
rule_files:
  - /etc/prometheus/rules/*.yml

# ---- Scrape Configs ----------------------------------------
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter — host system metrics (CPU, RAM, Disk, Network)
  - job_name: node_exporter
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: lgtm-host

  # Blackbox Exporter — HTTP, SSL probes
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://example.com         # Replace with your actual endpoints
          - http://app:8080/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Blackbox Exporter — SSL certificate expiry check
  - job_name: blackbox_ssl
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - example.com:443
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Alertmanager self-monitoring
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

  # Grafana self-monitoring
  - job_name: grafana
    static_configs:
      - targets: ['grafana:3000']

  # Loki self-monitoring
  - job_name: loki
    static_configs:
      - targets: ['loki:3100']

  # Tempo self-monitoring
  - job_name: tempo
    static_configs:
      - targets: ['tempo:3200']

  # OpenTelemetry Collector self-metrics
  - job_name: otel_collector
    static_configs:
      - targets: ['otel-collector:8889']

  # Prometheus Pushgateway — DORA metrics from GitHub Actions
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Demo instrumented application
  - job_name: demo_app
    static_configs:
      - targets: ['app:8080']
        labels:
          service: demo-app
          environment: production
