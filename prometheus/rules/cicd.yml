groups:
  - name: cicd_dora
    interval: 60s
    rules:

      # ---- Deployment Frequency ----------------------------------
      # How many deployments per day in the last 7 days
      - record: dora:deployment_frequency:per_day
        expr: |
          increase(cicd_deployments_total{job="pushgateway",status="success"}[7d]) / 7

      # ---- Change Failure Rate (CFR) -----------------------------
      # Percentage of deployments that caused a rollback or failure
      - record: dora:change_failure_rate:ratio
        expr: |
          rate(cicd_deployments_total{job="pushgateway",status="failure"}[7d])
          /
          (rate(cicd_deployments_total{job="pushgateway",status="success"}[7d])
           + rate(cicd_deployments_total{job="pushgateway",status="failure"}[7d]))

      # ---- Lead Time for Changes (LTC) ---------------------------
      # Average seconds from first commit to deployment
      - record: dora:lead_time_seconds:avg
        expr: |
          avg_over_time(cicd_lead_time_seconds{job="pushgateway"}[7d])

      # ---- Mean Time to Restore (MTTR) ---------------------------
      # Average seconds from incident detection to resolution
      - record: dora:mttr_seconds:avg
        expr: |
          avg_over_time(cicd_mttr_seconds{job="pushgateway"}[7d])

      # ---- Alerts ------------------------------------------------

      - alert: HighChangeFailureRate
        expr: dora:change_failure_rate:ratio > 0.15
        for: 10m
        labels:
          severity: warning
          team: platform
          runbook: https://github.com/nielvid/lgtm-stack/blob/main/runbooks/high_cfr.md
        annotations:
          summary: "Change Failure Rate exceeds 15% SLO"
          description: |
            CFR is {{ printf "%.1f" $value }} over the last 7 days.
            DORA elite performers target < 5%. Medium performers < 15%.
            Investigate recent deployments for instability patterns.

      - alert: HighMTTR
        expr: dora:mttr_seconds:avg > 3600
        for: 10m
        labels:
          severity: warning
          team: platform
          runbook: https://github.com/nielvid/lgtm-stack/blob/main/runbooks/high_mttr.md
        annotations:
          summary: "Mean Time to Restore exceeds 60-minute SLO"
          description: |
            MTTR is {{ $value | humanizeDuration }} (SLO: 60 minutes).
            DORA elite performers target < 1 hour. Review incident response process.

      - alert: LowDeploymentFrequency
        expr: dora:deployment_frequency:per_day < 1
        for: 24h
        labels:
          severity: info
          team: platform
        annotations:
          summary: "Deployment frequency below 1 per day"
          description: |
            Deployment frequency is {{ printf "%.2f" $value }} deployments/day over the last 7 days.
            Elite performers deploy multiple times per day.
