---
# =================================================================
# LGTM Observability Stack — Docker Compose
# All 10 services: Prometheus, Loki, Tempo, Grafana,
# Node Exporter, Blackbox Exporter, Alertmanager,
# OTel Collector, Pushgateway, Demo App
#
# Bring up the full stack:  docker compose up -d
# Tear down:                docker compose down -v
# =================================================================

x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

networks:
  observability:
    name: lgtm-network
    driver: bridge

volumes:
  prometheus_data: {}
  loki_data: {}
  tempo_data: {}
  grafana_data: {}

services:

  # ---------------------------------------------------------------
  # Prometheus — metrics collection & storage
  # ---------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.0
    <<: [*restart-policy, *default-logging]
    container_name: prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --storage.tsdb.retention.size=8GB
      - --web.enable-lifecycle
      - --web.enable-admin-api
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # ---------------------------------------------------------------
  # Alertmanager — alert routing & notifications
  # ---------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.27.0
    <<: [*restart-policy, *default-logging]
    container_name: alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=:9093
    environment:
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
    ports:
      - "9093:9093"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ---------------------------------------------------------------
  # Loki — log aggregation
  # ---------------------------------------------------------------
  loki:
    image: grafana/loki:3.3.2
    <<: [*restart-policy, *default-logging]
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------
  # Tempo — distributed tracing backend
  # ---------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.7.1
    <<: [*restart-policy, *default-logging]
    container_name: tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - ./tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
      - "4317:4317"   # OTLP gRPC (for direct client use)
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3200/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------
  # OpenTelemetry Collector — receives OTLP, routes to Loki & Tempo
  # ---------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    <<: [*restart-policy, *default-logging]
    container_name: otel-collector
    command: ["--config=/etc/otelcol-contrib/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/otel-collector-config.yaml:ro
    ports:
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # OTel Collector self-metrics
      - "8889:8889"   # Prometheus exporter (scraped by Prometheus)
    networks:
      - observability
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ---------------------------------------------------------------
  # Grafana — unified observability frontend
  # ---------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    <<: [*restart-policy, *default-logging]
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-changeme}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3000}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    networks:
      - observability
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ---------------------------------------------------------------
  # Node Exporter — host system metrics (CPU, RAM, Disk, Network)
  # ---------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: [*restart-policy, *default-logging]
    container_name: node-exporter
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    ports:
      - "9100:9100"
    networks:
      - observability
    pid: host
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ---------------------------------------------------------------
  # Blackbox Exporter — HTTP probes, SSL expiry checks
  # ---------------------------------------------------------------
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    <<: [*restart-policy, *default-logging]
    container_name: blackbox-exporter
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9115/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ---------------------------------------------------------------
  # Prometheus Pushgateway — receives DORA metrics from GitHub Actions
  # ---------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:v1.10.0
    <<: [*restart-policy, *default-logging]
    container_name: pushgateway
    command:
      - --persistence.file=/pushgateway/data
      - --persistence.interval=5m
    volumes:
      - /tmp/pushgateway:/pushgateway
    ports:
      - "9091:9091"
    networks:
      - observability
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9091/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

  # ---------------------------------------------------------------
  # Demo App — OpenTelemetry-instrumented Node.js service
  # ---------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    <<: [*restart-policy, *default-logging]
    container_name: demo-app
    environment:
      - APP_PORT=${APP_PORT:-8080}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      - NODE_ENV=production
    ports:
      - "8080:8080"
    networks:
      - observability
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
